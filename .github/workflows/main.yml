name: Build

on:
  push:
    branches:
      - 'master'
      - 'features/CvRemnants'
    tags-ignore:
      - '**'
    paths-ignore:
      - 'docs/**'
      - README.md

jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm ci
      working-directory: ./renderer
    - run: npm run make-index-files
      working-directory: ./renderer
    - run: npm run lint
      working-directory: ./renderer
    - run: npm run build
      working-directory: ./renderer
    - uses: actions/upload-artifact@v7
      with:
        name: renderer-dist
        path: ./renderer/dist
        retention-days: 1

  package:
    needs: renderer
    strategy:
      matrix:
        os: [windows-2025, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - uses: actions/download-artifact@v8
      with:
        name: renderer-dist
        path: ./renderer/dist

    # test adding opencv
    - name: Install OpenCV (Windows)
      if: ${{ startsWith(matrix.os, 'windows') }}
      run: choco install opencv -y
    - name: Set OpenCV env (Windows)
      if: ${{ startsWith(matrix.os, 'windows') }}
      run: |
        echo "OPENCV_INCLUDE_DIR=C:\tools\opencv\build\include" >> $env:GITHUB_ENV
        echo "OPENCV_LIB_DIR=C:\tools\opencv\build\x64\vc16\lib" >> $env:GITHUB_ENV
        echo "OPENCV_BIN_DIR=C:\tools\opencv\build\x64\vc16\bin" >> $env:GITHUB_ENV
        echo "OPENCV4NODEJS_DISABLE_AUTOBUILD=1" >> $env:GITHUB_ENV

    - name: Install OpenCV (Linux)
      if: ${{ startsWith(matrix.os, 'ubuntu') }}
      run: |
        sudo apt-get update
        sudo apt-get install -y libopencv-dev
        echo "OPENCV4NODEJS_DISABLE_AUTOBUILD=1" >> $GITHUB_ENV

    - name: Install OpenCV (macOS)
      if: ${{ startsWith(matrix.os, 'macos') }}
      run: |
        brew install opencv
        echo "OPENCV4NODEJS_DISABLE_AUTOBUILD=1" >> $GITHUB_ENV

    # contiue with actual build
    - run: npm ci
      working-directory: ./main
    - run: npm run build
      working-directory: ./main
    - run: npm run package "--" -p onTagOrDraft
      working-directory: ./main
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Hash
      if: ${{ startsWith(matrix.os, 'windows') }}
      run: type .\main\dist\latest.yml
    - name: Hash
      if: ${{ startsWith(matrix.os, 'ubuntu') }}
      run: cat ./main/dist/latest-linux.yml
    - name: Hash
      if: ${{ startsWith(matrix.os, 'macos') }}
      run: cat ./main/dist/latest-mac.yml
